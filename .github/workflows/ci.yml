name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npx --yes npm@10.9.4 ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lesson regression tests
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://qa-example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: browser-test-fixture
        run: npm run build

      - name: Install browser for regression checks
        timeout-minutes: 3
        # The runner image already includes Chrome/Chromium system libraries.
        run: npx playwright install chromium

      - name: Browser regression checks
        env:
          VITE_SUPABASE_URL: https://qa-example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: browser-test-fixture
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/langlume-vite.log 2>&1 &
          node scripts/preview-production.mjs > /tmp/langlume-preview.log 2>&1 &
          curl --fail --silent --retry 20 --retry-connrefused http://127.0.0.1:5173/ > /dev/null
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:5174/ > /dev/null
          npm run test:e2e
          node tests/demo-signup.e2e.mjs
          E2E_BASE_URL=http://127.0.0.1:5174 node tests/landing-theme.e2e.mjs
          node tests/offline-lessons.e2e.mjs
          node tests/airport-unit.e2e.mjs

      - name: npm audit (non-blocking)
        run: npm audit --audit-level=critical || true

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
